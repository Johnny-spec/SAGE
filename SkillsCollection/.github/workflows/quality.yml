name: Skill quality gates

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate schemas and registries
        run: python Common/quality_gate.py

      - name: Test Common
        working-directory: Common
        run: python -m pytest tests -q

      - name: Test root AI manager
        run: python -m pytest orchestrator/tests -q

      - name: Test Edge
        working-directory: Edge
        run: python -m pytest _shared/tests -q

      - name: Test IIS
        working-directory: IIS
        run: python -m pytest _shared/tests -q

      - name: Compile Python sources
        run: python -m compileall -q Common orchestrator IIS Edge

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $parseErrors = @()
          $files = @(git ls-files -- '*.ps1' '*.psm1')
          $files | ForEach-Object {
            $path = (Resolve-Path -LiteralPath $_).Path
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            )
            foreach ($error in $errors) {
              $parseErrors += "{0}:{1}: {2}" -f `
                $path, $error.Extent.StartLineNumber, $error.Message
            }
          }
          if ($parseErrors.Count) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }