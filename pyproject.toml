[project]
name = "sage"
version = "0.1.0"
description = "Governed message routing and execution for Agent Skills"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25,<2",
    "boto3>=1.40,<2",
    "deepagents>=0.7,<1",
    "fastapi>=0.135,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.25,<5",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "langchain-openai>=1.1,<2",
    "mcp>=1.13,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.36,<2",
    "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
    "opentelemetry-sdk>=1.36,<2",
    "pydantic>=2.11,<3",
    "psycopg[binary]>=3.3,<4",
    "PyJWT[crypto]>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "PyYAML>=6.0,<7",
    "temporalio>=1.32,<2",
    "uvicorn>=0.35,<1",
]

[project.scripts]
sage = "sage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["skills/iis-logs/vendor", "skills/SkillsCollection"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
