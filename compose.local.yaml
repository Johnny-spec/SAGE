services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sage
      POSTGRES_PASSWORD: sage-local-only
      POSTGRES_DB: sage
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sage -d sage"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  temporal:
    image: temporalio/auto-setup:1.27
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: sage
      POSTGRES_PWD: sage-local-only
      POSTGRES_SEEDS: postgres
    ports:
      - "127.0.0.1:7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  local-postgres: