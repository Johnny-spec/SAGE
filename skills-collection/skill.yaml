apiVersion: sage.dev/v1alpha1
kind: SkillBinding
metadata:
  name: skills-collection
  version: 1.0.0
spec:
  execution:
    type: python-subprocess
    entrypoint: scripts/orchestrator_wrapper.py
    arguments:
      - name: message
        option: --message
      - name: evidence_path
        option: --evidence-path
      - name: product
        option: --product
      - name: child_skill
        option: --child-skill
  inputSchema:
    type: object
    required: [message]
    additionalProperties: false
    properties:
      message:
        type: string
      evidence_path:
        type: string
      product:
        enum: [auto, IIS, Edge, both]
        default: auto
      child_skill:
        type: string
  outputSchema:
    type: object
    required: [skill, ok, findings, confidence, recommendations, raw]
    properties:
      skill:
        const: orchestrator
      ok:
        type: boolean
      findings:
        type: array
      root_cause:
        type: [string, "null"]
      confidence:
        type: string
      recommendations:
        type: array
      evidence_state:
        type: string
      error:
        type: [string, "null"]
      raw:
        type: object
  routing:
    keywords:
      - skills collection
      - skillscollection
      - diagnostic manager
      - cross-product
      - coordinated diagnosis
      - 综合诊断
      - 多产品诊断
      - 诊断管理器
    attachmentTypes: []
  policy:
    risk: read-only
    timeoutSeconds: 180
    maxOutputBytes: 8388608