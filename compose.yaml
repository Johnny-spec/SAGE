services:
  sage:
    build: .
    ports:
      - "8000:8000"
    environment:
      SAGE_ENVIRONMENT: development
      SAGE_REPLICA_COUNT: "1"
      SAGE_ADMIN_AUTH_ENABLED: "false"
      SAGE_CONTROL_DATA_ROOT: /var/lib/sage
      SAGE_SKILLS_ROOT: /app/skills
      SAGE_AUTHENTICATION_MODE: anonymous
      SAGE_ARTIFACT_BACKEND: s3
      SAGE_S3_BUCKET: sage-artifacts
      SAGE_S3_PREFIX: sage
      SAGE_S3_ENDPOINT_URL: http://minio:9000
      SAGE_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: sage
      AWS_SECRET_ACCESS_KEY: sage-development-secret
      SAGE_CHECKPOINT_DATABASE_URL: postgresql://sage:sage@postgres:5432/sage?sslmode=disable
      SAGE_TEMPORAL_TARGET: temporal:7233
      SAGE_TEMPORAL_NAMESPACE: default
      SAGE_TEMPORAL_TASK_QUEUE: sage-workflows
      SAGE_RUNNER_URL: http://sage-runner:8080
      SAGE_RUNNER_TOKEN: sage-development-runner-token-change-me
      SAGE_RUNNER_PROFILE: python-restricted-v1
      SAGE_ALLOW_LOCAL_SUBPROCESS: "false"
    volumes:
      - sage-state:/var/lib/sage
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      sage-runner:
        condition: service_healthy
    restart: unless-stopped

  sage-runner:
    build: .
    command: ["uvicorn", "sage.runner_app:create_runner_app", "--factory", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      SAGE_RUNNER_TOKEN: sage-development-runner-token-change-me
      SAGE_RUNNER_PROFILE: python-restricted-v1
      SAGE_RUNNER_WORK_ROOT: /tmp/sage-runner
      SAGE_RUNNER_MAX_CONCURRENCY: "1"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sage-worker:
    build: .
    command: ["python", "-m", "sage.temporal_worker"]
    environment:
      SAGE_API_BASE_URL: http://sage:8000
      SAGE_TEMPORAL_TARGET: temporal:7233
      SAGE_TEMPORAL_NAMESPACE: default
      SAGE_TEMPORAL_TASK_QUEUE: sage-workflows
      SAGE_TEMPORAL_TLS: "false"
    depends_on:
      sage:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sage
      POSTGRES_PASSWORD: sage
      POSTGRES_DB: sage
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sage -d sage"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.27
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: sage
      POSTGRES_PWD: sage
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: sage
      MINIO_ROOT_PASSWORD: sage-development-secret
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 sage sage-development-secret; do sleep 1; done;
        mc mb --ignore-existing local/sage-artifacts

volumes:
  sage-state:
  postgres-data:
  minio-data:
