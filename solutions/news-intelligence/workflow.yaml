apiVersion: sage.dev/v1alpha1
kind: WorkflowTemplate
workflowId: build-news-brief
version: 1.0.0
steps:
  - id: analyze
    kind: skill
    target: news-intelligence
    timeoutSeconds: 300
    retry:
      maximum_attempts: 3
      initial_interval_seconds: 2
      backoff_coefficient: 2
      maximum_interval_seconds: 30
