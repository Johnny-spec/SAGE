apiVersion: sage.dev/v1alpha1
kind: SkillBinding
metadata:
  name: enterprise-qa
  version: 1.0.0
spec:
  execution:
    type: builtin
    handler: enterprise-qa
  inputSchema:
    type: object
    properties:
      query: {type: string, minLength: 1}
      documents:
        type: array
        items:
          type: object
          properties:
            id: {type: string, minLength: 1}
            title: {type: string}
            text: {type: string, minLength: 1}
          required: [id, text]
          additionalProperties: false
    required: [query, documents]
    additionalProperties: false
  outputSchema:
    type: object
    properties:
      status: {enum: [answered, insufficient-evidence]}
      answer: {type: string}
      citations:
        type: array
        items:
          type: object
          properties:
            document_id: {type: string}
            title: {type: string}
            quote: {type: string}
          required: [document_id, title, quote]
          additionalProperties: false
    required: [status, answer, citations]
    additionalProperties: false
  routing:
    keywords: [enterprise qa, document question, knowledge base]
  policy:
    risk: read-only
    timeoutSeconds: 10
    maxOutputBytes: 131072
