apiVersion: sage.dev/v1alpha1
kind: SkillBinding
metadata:
  name: echo
  version: 1.0.0
spec:
  execution:
    type: builtin
    handler: echo
  inputSchema:
    type: object
    required: [text]
    additionalProperties: false
    properties:
      text:
        type: string
  outputSchema:
    type: object
    required: [text]
    additionalProperties: false
    properties:
      text:
        type: string
  routing:
    keywords: [echo, repeat, 回显, 重复]
    attachmentTypes: []
  policy:
    risk: read-only
    timeoutSeconds: 5
    maxOutputBytes: 4096
