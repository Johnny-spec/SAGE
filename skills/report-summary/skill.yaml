apiVersion: sage.dev/v1alpha1
kind: SkillBinding
metadata:
  name: report-summary
  version: 1.0.0
spec:
  execution:
    type: builtin
    handler: report-summary
  inputSchema:
    type: object
    required: [analysis]
    additionalProperties: false
    properties:
      analysis:
        type: object
      title:
        type: string
  outputSchema:
    type: object
    required: [title, summary, request_count, finding_count, status, recommendations]
    additionalProperties: false
    properties:
      title:
        type: string
      summary:
        type: string
      request_count:
        type: integer
      finding_count:
        type: integer
      status:
        enum: [healthy, attention]
      recommendations:
        type: array
        items:
          type: string
  routing:
    keywords: []
    attachmentTypes: []
  policy:
    risk: read-only
    timeoutSeconds: 5
    maxOutputBytes: 65536