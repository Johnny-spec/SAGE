apiVersion: sage.dev/v1alpha1
kind: SkillBinding
metadata:
  name: contract-review
  version: 1.0.0
spec:
  execution:
    type: builtin
    handler: contract-review
  inputSchema:
    type: object
    properties:
      contract_text: {type: string, minLength: 1}
      party_role: {enum: [buyer, seller, neutral], default: neutral}
    required: [contract_text]
    additionalProperties: false
  outputSchema:
    type: object
    properties:
      status: {enum: [needs-review, draft-complete]}
      party_role: {enum: [buyer, seller, neutral]}
      issues: {type: array, items: {type: object}}
      citations: {type: array, items: {type: object}}
      disclaimer: {type: string}
    required: [status, party_role, issues, citations, disclaimer]
    additionalProperties: false
  routing:
    keywords: [contract review, 合同审查, 条款风险]
  policy:
    risk: read-only
    timeoutSeconds: 10
    maxOutputBytes: 262144
